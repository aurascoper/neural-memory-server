[package]
name = "neural-memory-personal"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "neural-memory-personal-sync"
path = "src/bin/personal-sync.rs"

[[bin]]
name = "neural-memory-personal-mcp"
path = "src/bin/personal-mcp.rs"

[[bin]]
name = "neural-memory-personal-transport"
path = "src/bin/personal-transport.rs"

[[bin]]
name = "neural-memory-evidence-dr"
path = "src/bin/evidence-dr.rs"

[[bin]]
name = "neural-memory-interaction-logs-dr"
path = "src/bin/interaction-logs-dr.rs"

[[bin]]
name = "neural-memory-personal-admin"
path = "src/bin/personal-admin.rs"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_json_canonicalizer = "0.3"
sha2 = { workspace = true }
unicode-normalization = "0.1"
ureq = { version = "2", features = ["json"] }
url = "2"

[dev-dependencies]
tempfile = "3"
