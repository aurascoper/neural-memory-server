[package]
name = "neural-memory-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
neural-memory-domain = { path = "../neural-memory-domain" }
neural-memory-store = { path = "../neural-memory-store" }
serde = { workspace = true }
serde_json = { workspace = true }
# Sync HTTP, no async runtime. Network I/O lives in the shell crate; the store
# does SQLite and nothing else.
ureq = { version = "2", features = ["json"] }

[[bin]]
name = "neural-memory-mcp"
path = "src/bin/mcp.rs"

[[bin]]
name = "neural-memory-admin"
path = "src/bin/admin.rs"

[[bin]]
name = "neural-memory-import-gpd"
path = "src/bin/import-gpd.rs"

[[bin]]
name = "neural-memory-import-contested"
path = "src/bin/import-contested.rs"

[[bin]]
name = "neural-memory-ingest"
path = "src/bin/ingest.rs"

[[bin]]
name = "neural-memory-embed"
path = "src/bin/embed.rs"

[[bin]]
name = "neural-memory-eval-retrieval"
path = "src/bin/eval-retrieval.rs"

[[bin]]
name = "neural-memory-bench-durability"
path = "src/bin/bench-durability.rs"
