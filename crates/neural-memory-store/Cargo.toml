[package]
name = "neural-memory-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
neural-memory-domain = { path = "../neural-memory-domain" }
serde = { workspace = true }
serde_json = { workspace = true }
# `bundled` pins the engine version to the build rather than to whatever the
# distro ships, so a migration cannot pass here and fail on another machine.
rusqlite = { version = "0.32", features = ["bundled"] }
# TOML rather than JSON for ingest documents: evidence needs comments, and
# where a figure came from is often more important than the figure.
toml = "0.8"

[dev-dependencies]
tempfile = "3"
