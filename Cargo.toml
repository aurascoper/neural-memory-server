[workspace]
resolver = "2"
members = [
    "crates/neural-memory-domain",
    "crates/neural-memory-store",
    "crates/neural-memory-mcp",
]

# Upstream (neuralcompose-client-native) has no [workspace.dependencies]; it is a
# single-crate workspace. This one has several crates that must agree on serde and
# sha2 versions, so the shared set lives here.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
