# M7-B v6-1 hardening: the authority gap that survived the first pass.
#
# NeuralCompose commit 54f2a31, following a3a8382 on the same branch.
#
# This exists because the first pass READ as complete and was not. It passed
# eight adversarial regressions, every CI gate at the exact head, and a written
# review of its own limitations -- and still shipped a hole that a reviewer
# found by reading what validate_v6_declaration actually checks rather than
# what its commit message claimed. Recording the shape of that miss is worth
# more than recording the fix.

