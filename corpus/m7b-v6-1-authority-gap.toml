# ---------------------------------------------------------------------------
# The defect
# ---------------------------------------------------------------------------

[[claim]]
id = "c_gap"
text = "Removing a forgeable corpus digest made the corpus content-addressed but not build-owned: validate_v6_declaration checked the corpus for shape only, and shape is satisfiable by a corpus nobody reviewed, so a caller could submit a different eighteen-prompt corpus, let Rust derive its identity honestly, pass validation, and replace the reviewed study without forging anything"
evidence = "external"
locator = "commit a3a8382"

[[claim]]
id = "c_gap_policy"
text = "The same gap covered the composition policy and the evaluator policy identities, where a correct domain prefix with a different version suffix passed the prefix check, so an unknown evaluator could name itself under the right domain and be accepted"
evidence = "external"
locator = "commit a3a8382"

[[claim]]
id = "c_two_questions"
text = "The underlying error was conflating two questions and asking only one: whether a corpus is well formed, and whether a corpus is ours; content-addressing answers neither, it only establishes that an identity cannot be forged"
evidence = "decision"
locator = "commit 54f2a31"

# ---------------------------------------------------------------------------
# The fix, and why the older checks stay
# ---------------------------------------------------------------------------

[[claim]]
id = "c_exact_equality"
text = "The declaration now requires exact equality against the compiled-in corpus, composition policy and evaluator policy identities, so the caller is never the party that says what the study is over"
evidence = "observed"
artifact = "module2"
locator = "crates/neuralcompose-mobile-core/src/generation_eval.rs"

[[claim]]
id = "c_shape_not_redundant"
text = "The shape checks are not made redundant by the authority check: they are what catches a bad edit to the committed artifact itself, where frozen_corpus_v1 returns the bad corpus and equality therefore holds, and one regression pins exactly that by remaining green when the authority check is removed"
evidence = "observed"
artifact = "suite2"
locator = "tests/m7b_eval_protocol.rs"

[[claim]]
id = "c_mutation_auth"
text = "Removing the three authority checks fails exactly the four new authority regressions and nothing else, which is what distinguishes them from the shape checks that were already present"
evidence = "observed"
artifact = "suite2"
locator = "tests/m7b_eval_protocol.rs"
observations = ["o_mut_auth"]

[[claim]]
id = "c_compile_pairs"
text = "The compile-level check is paired doctests rather than a trybuild dependency because doctests already run in this CI; the pairing is required because a compile_fail block alone passes when the code fails to compile for any reason at all, so each has a companion differing only by the digest that must compile"
evidence = "observed"
artifact = "module2"
locator = "crates/neuralcompose-mobile-core/src/generation_eval.rs"

[[claim]]
id = "c_mutation_doc"
text = "Reintroducing corpus_sha256_hex on BenchmarkCorpus flips exactly that doctest pair, the compile_fail half by starting to compile and its companion by ceasing to, while the V6Declaration and corpus_identity pairs stay green because only one type was mutated"
evidence = "observed"
artifact = "module2"
locator = "crates/neuralcompose-mobile-core/src/generation_eval.rs"
observations = ["o_mut_doc"]

[[claim]]
id = "c_three_layers"
text = "No single layer is sufficient: compile-fail pairs cannot catch a digest reintroduced under a different name, the source scan cannot prove a construction is impossible, and neither can stop a shape-valid corpus that was never reviewed, so all three are kept"
evidence = "decision"
locator = "crates/neuralcompose-mobile-core/src/generation_eval.rs"

[[claim]]
id = "c_no_ffi_change"
text = "The hardening changed two files and produced no binding drift, because the FFI surface is unchanged and only validation semantics moved"
evidence = "observed"
artifact = "module2"
locator = "M7-B hardening"
observations = ["o_tests2"]

[[claim]]
id = "c_registry"
text = "If a later protocol version needs several corpora the answer is a build-owned registry with a membership check, not reopening arbitrary corpus injection"
evidence = "decision"
locator = "crates/neuralcompose-mobile-core/src/generation_eval.rs"

