# --- the two rivals ---------------------------------------------------------
# Each is `derived`, so the store re-runs the arithmetic and refuses a mismatch.
# Both check out against different baselines, which is what makes this a real
# disagreement rather than one of them being a mistake. The prose in §3 names
# neither baseline.

[[claim]]
id = "g4"
text = "Generation at 24 threads changes by -27.4 percent against the 8-thread baseline"
evidence = "derived"
artifact = "doc"
locator = "§3 derived"
observations = ["t24", "t8"]
[claim.derivation]
transform = "percentChange"
value = "t24"
baseline = "t8"
decimals = 1

[[claim]]
id = "g5"
text = "Generation at 24 threads changes by -26.8 percent against the 12-thread baseline"
evidence = "derived"
artifact = "doc"
locator = "§3 derived"
observations = ["t24", "t12"]
[claim.derivation]
transform = "percentChange"
value = "t24"
baseline = "t12"
decimals = 1

[[claim]]
id = "g6"
text = "Section 3 states the 24-thread generation penalty as -27.4 percent without naming which baseline it is measured against"
evidence = "observed"
artifact = "doc"
locator = "§3 prose"

