# The contested corpus, as data rather than as Rust.
#
# This is the same evidence `corpus_contested.rs` writes by hand. It exists to
# prove the ingest format is general enough to express a real corpus, including
# the awkward parts: a genuine unresolved disagreement, two derivations the
# store re-runs, and claims whose evidence class has to be earned.
#
# `tests/ingest.rs` asserts this file produces byte-identical record digests to
# the Rust importer. If the format could not express something, that test fails
# rather than the gap going unnoticed.

