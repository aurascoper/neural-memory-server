# Entity dictionary, second tranche: the storage and instrumentation subjects
# the M3 records introduced.
#
# WRITTEN BEFORE ANY v2 EVAL QUERY. That order matters and is the only thing
# keeping this from being tuning: choosing which entities exist after seeing
# which queries do badly would make the entity branch look good by construction.
# The entities here are the things these records are *about*, chosen by reading
# the records, not by reading a scoreboard.
#
# Aliases still share no wording with the canonical name where possible -- an
# alias that restates the name adds nothing FTS5 does not already do better.
#
# A caveat this file cannot fix, stated here so it travels with the data: an
# alias query is a query I wrote using an alias I also wrote. The C_alias class
# therefore measures whether the branch works as designed, not whether it helps
# on queries someone else would ask. See docs/acceptance/m2-retrieval-ablation.md.

version = 1
recorded_at = "2026-07-31T20:00:00Z"

