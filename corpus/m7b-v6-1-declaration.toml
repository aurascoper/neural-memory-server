# ---------------------------------------------------------------------------
# The three defects, as they were before the fix
# ---------------------------------------------------------------------------

[[claim]]
id = "c_bug_corpus"
text = "The frozen corpus did not exist: git ls-files at ff65d9d5 returned no corpus, prompt or rubric artifact, corpus_id and corpus_sha256_hex were validated only for non-emptiness, and the only values they ever held were the test fixtures m7b-sanitized-v1 and sha(0xa1), so the digest the protocol claimed to bind was an unbacked caller assertion"
evidence = "external"
locator = "issue #7 finding 5"

[[claim]]
id = "c_bug_coverage"
text = "Quality-plan coverage was declared but not enforced: run_plan and quality_plan were validated for non-emptiness and candidate consistency only, so a plan could score one prompt twice and another never while the frozen equal-prompt macro rule averaged a set nobody declared"
evidence = "external"
locator = "issue #7 finding 1"

[[claim]]
id = "c_bug_float"
text = "The ten quality axes and material_quality_margin were f64, and the two-stage average of ten all-0.8 axes observes 0.8000000000000002, which is harmless for display and decisive when compared against an exact material margin"
evidence = "external"
locator = "issue #7 finding 4"

# ---------------------------------------------------------------------------
# What now holds
# ---------------------------------------------------------------------------

[[claim]]
id = "c_corpus_owned"
text = "The corpus is a committed artifact that Rust include_bytes! compiles in and whose identity is derived from its content by domain-tagged hash; corpus_id, corpus_sha256_hex and the caller-supplied expected_prompts list are all removed, so there is no API path that pairs arbitrary corpus content with an asserted digest"
evidence = "observed"
artifact = "module"
locator = "crates/neuralcompose-mobile-core/src/generation_eval.rs"
observations = ["o_prompts"]

[[claim]]
id = "c_fixture_gate"
text = "check-fixtures.sh re-serializes the parsed corpus value canonically and diffs it against the same committed file, so the compiled bytes and the reviewable artifact are proven to agree rather than assumed to; the hand-authored file was byte-identical to the canonical form on first run"
evidence = "observed"
artifact = "corpus"
locator = "scripts/check-fixtures.sh"

[[claim]]
id = "c_exact"
text = "Quality axes are integer millionths and aggregation carries an exact rational, so a ledger of all-0.8 axes derives back to exactly 800000/1 and a margin of exactly 0.1 against a material margin of exactly 0.1 promotes rather than splitting"
evidence = "observed"
artifact = "suite"
locator = "tests/m7b_eval_protocol.rs"
observations = ["o_module"]

[[claim]]
id = "c_selection"
text = "The required selection coverage is derived from the corpus and the frozen seeds and compared against the quality plan, with each entry cross-referenced against the unique matching warm run-plan slot, so a doubled slot and the prompt it was stolen from are both named"
evidence = "observed"
artifact = "module"
locator = "crates/neuralcompose-mobile-core/src/generation_eval.rs"

[[claim]]
id = "c_scorer"
text = "Each scored mark is compared against the scorer identity the declaration names rather than against its neighbours, so a ledger scored end to end by an undeclared panel is rejected for being undeclared and not merely for being inconsistent"
evidence = "observed"
artifact = "module"
locator = "crates/neuralcompose-mobile-core/src/generation_eval.rs"

[[claim]]
id = "c_gates"
text = "All eight CI gates passed on the committed tree at a3a8382 and the tree stayed clean afterwards, which is what shows the two regeneration gates are idempotent rather than merely satisfied once"
evidence = "observed"
