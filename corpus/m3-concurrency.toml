# M3: concurrency. Two defects found prospectively, and the invariants that
# now hold.
#
# Hand-written, unlike corpus/m3-durability.toml. The pass counts below are
# transcribed from a real run and the suite digests pin exactly which tests
# produced them -- change a test and the digest changes, so this attestation
# stops applying to it.
#
# Both defects were found by writing the test BEFORE assuming which failures
# existed. Neither was on the list of things I expected to fix: the plan named
# `busy_timeout` as the likely culprit and busy_timeout turned out to be
# correct already.

