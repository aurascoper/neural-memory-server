# ---------------------------------------------------------------------------
# The two defects. `external` rather than `observed`: the pre-fix source was
# replaced, so there is no artifact left to attest them against. Recording them
# as observations would claim evidence that no longer exists -- the same reason
# the Track A checker bugs are external.
# ---------------------------------------------------------------------------

[[claim]]
id = "c_bug_wal"
text = "PRAGMA journal_mode=WAL returns SQLITE_BUSY immediately and does not invoke the busy handler, so busy_timeout does not cover it; with eight processes opening a fresh store, three failed with database is locked on each of three consecutive runs while busy_timeout read back as 5000 ms"
evidence = "external"
locator = "M3 concurrency"

[[claim]]
id = "c_bug_migrate"
text = "The migration runner checked whether a migration was applied outside the transaction that applies it and used a DEFERRED transaction, so two processes could both pass the check and both run the same DDL; this produced 0002_embeddings duplicate column name identity on one run in three"
evidence = "external"
locator = "M3 concurrency"

[[claim]]
id = "c_fix_wal"
text = "journal_mode is a persistent property of the file, so Store::open now reads it first and only attempts the switch when it is not already WAL, with bounded retry for the cold-create case where every process legitimately contends"
evidence = "decision"
locator = "M3 concurrency"

[[claim]]
id = "c_fix_migrate"
text = "Migrations now use BEGIN IMMEDIATE, which takes the write lock at BEGIN and does honour busy_timeout, and re-check inside the lock; the unlocked pre-check is retained only so the steady state takes no write lock"
evidence = "decision"
locator = "M3 concurrency"

# ---------------------------------------------------------------------------
# Method
# ---------------------------------------------------------------------------

[[claim]]
id = "c_three_runs"
text = "The migration race defect survived a first clean run and appeared on the second, so a concurrency test that passes once has demonstrated nothing; three consecutive clean runs was pre-registered as the minimum and is what caught it"
evidence = "decision"
locator = "M3 concurrency"

[[claim]]
id = "c_negative_control"
text = "A concurrency test that passes proves nothing unless the contention is real, so the suite removes the busy handler and asserts the second writer fails, then restores it and asserts the same write succeeds"
evidence = "decision"
locator = "M3 concurrency"

[[claim]]
id = "c_busy_timeout_was_fine"
text = "rusqlite already sets busy_timeout to 5000 ms, so the fix the plan anticipated was for a defect that did not exist; both real defects were elsewhere and neither was predicted"
evidence = "external"
locator = "M3 concurrency"

[[claim]]
id = "c_default_deployment"
text = "The MCP server is registered user-scope, so every Claude Code session spawns a process against one SQLite file and concurrent access is the default deployment rather than an edge case"
evidence = "external"
locator = "M3 concurrency"

